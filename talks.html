<style>
  :root{
    --ink:#1a1d24;--muted:#5b6573;--faint:#8a94a3;--line:#e3e7ed;
    --paper:#fbfaf7;--blue:#1f4e79;--blue-soft:#eef3f8;--accent:#9a6a3c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px;}
  a{color:var(--blue);text-decoration:none;}
  a:hover{text-decoration:underline;}

  .topbar{border-bottom:1px solid var(--line);background:#fff;}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;}
  .back{font-family:'Spectral',serif;font-weight:600;color:var(--ink);font-size:1rem;}
  .back:hover{text-decoration:none;color:var(--blue);}
  .topbar nav a{color:var(--muted);font-size:.9rem;margin-left:16px;}

  header.head{padding:44px 0 8px;}
  header.head h1{font-family:'Spectral',serif;font-weight:600;font-size:2.1rem;letter-spacing:-0.02em;}
  header.head p{color:var(--muted);margin-top:8px;}

  .yeargroup{padding:24px 0 6px;}
  .yeargroup h2{font-family:'Spectral',serif;font-weight:600;font-size:1.25rem;color:var(--blue);
    padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px;}
  .talk{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.94rem;}
  .talk:last-child{border-bottom:none;}
  .talk .what{color:var(--ink);}
  .talk .what .place{color:var(--muted);}
  .talk .plenary{color:var(--accent);font-weight:600;font-size:.78rem;margin-left:6px;}
  .talk .when{color:var(--faint);font-size:.85rem;white-space:nowrap;text-align:right;}

  footer{border-top:1px solid var(--line);padding:26px 0 46px;color:var(--muted);font-size:.88rem;margin-top:30px;}
  footer a{color:var(--muted);}

  @media (max-width:560px){
    header.head h1{font-size:1.7rem;}
    .talk{flex-direction:column;gap:2px;}
    .talk .when{text-align:left;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a href="index.html" class="back">← Luca Nenna</a>
    <nav>
      <a href="publications.html">Publications</a>
      <a href="index.html#group">Group</a>
      <a href="index.html#teaching">Teaching</a>
    </nav>
  </div>
</div>

<header class="head">
  <div class="wrap">
    <h1>Talks &amp; seminars</h1>
    <p>Invited talks, seminars and conference presentations. Newest first.</p>
  </div>
</header>

<main class="wrap" id="list"></main>

<footer>
  <div class="wrap">
    Luca Nenna · <a href="index.html">Home</a> ·
    <a href="https://scholar.google.com/citations?user=1_r-io8AAAAJ&hl=en" target="_blank" rel="noopener">Google Scholar</a>
  </div>
</footer>

<script src="talks-data.js"></script>
<script>

const listEl = document.getElementById('list');
let html=''; let last=null;
TALKS.slice().sort((a,b)=>b.year-a.year).forEach(t=>{
  if(t.year!==last){ if(last!==null) html+='</div>'; html+='<div class="yeargroup"><h2>'+t.year+'</h2>'; last=t.year; }
  html += '<div class="talk"><div class="what">'+t.what+', <span class="place">'+t.place+'</span>'
    + (t.tag==='plenary'?'<span class="plenary">· plenary</span>':'')
    + '</div><div class="when">'+t.when+'</div></div>';
});
html+='</div>';
listEl.innerHTML = html;
</script>
</body>
</html>
